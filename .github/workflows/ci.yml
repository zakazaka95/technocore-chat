name: Verify 107 and 614 integration

# Fork-only verification branch: never a production PR or an automatic push job.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-107-614-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - run: uv sync --frozen

      - name: Verify exact source heads and the unchanged production patch
        run: |
          git fetch --depth=1 origin 73a732497a19cac11aff4dcb527bae3c52b02f73 7ae91b493c51d7c7d0572db820710a41de98244d
          uv run python - <<'PY'
          import pathlib
          import subprocess

          main = "73a732497a19cac11aff4dcb527bae3c52b02f73"
          original_107 = "7ae91b493c51d7c7d0572db820710a41de98244d"
          original_614 = "1c8d71ed1469269aee59edf086af20bc76190af9"

          def source(revision):
              return subprocess.check_output(["git", "show", f"{revision}:src/store.py"]).decode()

          def apply_107(text):
              changes = (
                  ('rec = {"seq": 0, "ts": _now(), "from": valid_name(nick), "text": clean_text(text)}',
                   'rec = {"seq": 0, "ts": "", "from": valid_name(nick), "text": clean_text(text)}'),
                  ('rec = {"seq": 0, "ts": _now(), "from": did, "text": clean_text(text), "nonce": nonce}',
                   'rec = {"seq": 0, "ts": "", "from": did, "text": clean_text(text), "nonce": nonce}'),
                  ('rec["seq"] = last_seq(root, room) + 1',
                   'rec.update(seq=last_seq(root, room) + 1, ts=_now())'),
              )
              for before, after in changes:
                  assert text.count(before) == 1, before
                  text = text.replace(before, after, 1)
              return text

          assert apply_107(source(main)) == source(original_107)
          assert apply_107(source(original_614)) == pathlib.Path("src/store.py").read_text(encoding="utf-8")
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", original_614, "--", "src/"]
          ).decode().splitlines()
          assert changed == ["src/store.py"], changed
          print(f"main: {main}\n107: {original_107}\n614: {original_614}")
          print("Both production trees differ only by the same three timestamp-under-lock substitutions.")
          PY

      - name: Negative control for the refreshed 107 regression on exact main
        run: |
          git show 73a732497a19cac11aff4dcb527bae3c52b02f73:src/store.py > src/store.py
          git show 7ae91b493c51d7c7d0572db820710a41de98244d:tests/unit/test_store.py > tests/unit/test_store.py
          set +e
          uv run pytest tests/unit/test_store.py::test_concurrent_writers_cannot_put_an_expired_record_after_a_fresh_one -q --junitxml="$RUNNER_TEMP/107-negative.xml"
          status=$?
          set -e
          test "$status" -eq 1
          uv run python tests/verify_107_614_control.py "$RUNNER_TEMP/107-negative.xml" 2 2 test_concurrent_writers_cannot_put_an_expired_record_after_a_fresh_one 'assert [record["ts"] for record in records]'
          git show HEAD:tests/unit/test_store.py > tests/unit/test_store.py

      - name: Negative control for export integration on exact 614
        run: |
          git show 1c8d71ed1469269aee59edf086af20bc76190af9:src/store.py > src/store.py
          set +e
          uv run pytest tests/unit/test_107_614_integration_local.py -q --junitxml="$RUNNER_TEMP/614-negative.xml"
          status=$?
          set -e
          test "$status" -eq 1
          uv run python tests/verify_107_614_control.py "$RUNNER_TEMP/614-negative.xml" 6 2 test_prelock_interleaving_export_agrees_with_full_scan 'assert export_bytes(tmp_path, room) == expected'

      - name: Combined fix and existing export suites
        run: |
          git show HEAD:src/store.py > src/store.py
          uv run pytest tests/unit/test_107_614_integration_local.py tests/unit/test_export_snapshot.py tests/http/test_export.py -q
          git diff --exit-code -- src/store.py tests/unit/test_store.py

      - name: Full native Linux checks on the combined tree
        run: uv run just check

  browser:
    name: humans page in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Node and Playwright
        working-directory: tests
        run: |
          node --version
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the service
        run: |
          CHAT_ROOT="$(mktemp -d)" \
            uv run uvicorn --app-dir src app:app --port 8099 --log-level warning &
          for _ in $(seq 30); do
            curl -fsS localhost:8099/healthz && break
            sleep 1
          done
      - name: Drive /humans in Chromium
        run: node tests/humans_ui_probe.mjs 8099
